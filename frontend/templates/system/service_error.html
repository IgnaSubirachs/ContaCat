{% extends "base.html" %}
{% block content %}
<div class="service-error card shadow-sm">
    <div class="card-body p-5 text-center">
        <div class="service-error-icon mb-3">
            <i class="fas {% if status_code == 403 %}fa-lock{% else %}fa-plug{% endif %}"></i>
        </div>
        <div class="eyebrow">Servei temporalment no disponible</div>
        <h1 class="h3 mb-3">
            {% if status_code == 403 %}No tens permisos per accedir-hi{% else %}Aquest mòdul necessita un servei addicional{% endif %}
        </h1>
        <p class="text-muted mx-auto mb-4" style="max-width: 680px;">{{ detail }}</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="/" class="btn btn-primary">Tornar al panell</a>
            <a href="/system/status" class="btn btn-outline-secondary">Veure estat del sistema</a>
        </div>
    </div>
</div>
{% endblock %}
