<div id="cat-assistant-container">
    <div id="cat-bubble" class="cat-bubble">
        <span id="cat-message">Tinc a punt el nou shell. Seguim transformant l'ERP.</span>
        <div class="cat-bubble-arrow"></div>
    </div>

    <a href="/ai" class="cat-avatar-wrapper" style="text-decoration: none;">
        <img src="/static/img/cat_assistant.png" alt="Cat Assistant" class="cat-avatar-img">
    </a>
</div>

<style>
    #cat-assistant-container {
        position: fixed;
        bottom: 24px;
        right: 28px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    .cat-avatar-wrapper {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid rgba(255, 248, 239, 0.96);
        box-shadow: 0 18px 34px rgba(23, 50, 77, 0.2);
        cursor: pointer;
        background: linear-gradient(145deg, #fff9ef, #f2e6d2);
        transition: transform 0.2s ease;
    }

    .cat-avatar-wrapper:hover {
        transform: scale(1.05);
    }

    .cat-avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .cat-bubble {
        background: rgba(255, 252, 247, 0.97);
        padding: 15px 20px;
        border-radius: 20px 20px 4px 20px;
        box-shadow: 0 18px 34px rgba(23, 50, 77, 0.14);
        border: 1px solid rgba(23, 50, 77, 0.08);
        margin-bottom: 15px;
        max-width: 280px;
        position: relative;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.3s ease;
        pointer-events: none;
        font-size: 0.95rem;
        line-height: 1.45;
        color: #17324d;
    }

    .cat-bubble.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }

    .cat-bubble-arrow {
        position: absolute;
        bottom: -10px;
        right: 20px;
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 0 solid transparent;
        border-top: 10px solid rgba(255, 252, 247, 0.97);
    }
</style>

<script>
    let bubbleTimeout;

    function catSay(message, duration = 5000) {
        const bubble = document.getElementById('cat-bubble');
        const msgSpan = document.getElementById('cat-message');
        msgSpan.innerHTML = message;
        bubble.classList.add('visible');
        clearTimeout(bubbleTimeout);
        if (duration > 0) {
            bubbleTimeout = setTimeout(() => {
                bubble.classList.remove('visible');
            }, duration);
        }
    }

    setTimeout(() => {
        catSay("El front nou ja esta posat. Ara podem polir vendes, compres i comptabilitat amb cara de producte.", 4800);
    }, 1200);
</script>
