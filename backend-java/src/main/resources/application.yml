spring:
  application:
    name: contacat-erp
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/erpdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Madrid}
    username: ${DB_USER:erpuser}
    password: ${DB_PASSWORD:erppass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

contacat:
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:4200}
